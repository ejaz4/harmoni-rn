name: Android

# Every push to main builds an installable APK and publishes it as a GitHub
# Release tagged v1.0.<run number>. The app finds these and updates itself
# (Obtainium can follow them too).
# Pull requests build too (Actions › the run › Artifacts) but don't release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      architectures:
        description: "CPU architectures to build"
        default: "arm64-v8a,armeabi-v7a"
        type: choice
        options: ["arm64-v8a,armeabi-v7a", "arm64-v8a"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Release signing (optional): add these repository secrets to sign with your own key.
      # Without them the APK is signed with the shared debug key, which is fine for testing.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # The app updates itself from this repository's releases (src/update).
      EXPO_PUBLIC_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags, for the release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Version
        # The release tag matches the app's version name, so Obtainium can tell what's installed.
        run: echo "APP_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test src

      - name: Generate the Android project
        run: CI=1 bunx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "HARMONI_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "HARMONI_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "HARMONI_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "HARMONI_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Make room
        # The runner's root disk is small and React Native's native build is big (and memory hungry).
        run: |
          df -h / /mnt
          # systemd-oomd SIGTERMs (exit 143) builds under memory pressure; the job has the machine to itself.
          sudo systemctl stop systemd-oomd || true
          # Toolchains this build never uses.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/local/julia* || true
          # Keep only the NDK React Native builds with.
          for d in /usr/local/lib/android/sdk/ndk/*; do
            [ "$(basename "$d")" = "27.1.12297006" ] || sudo rm -rf "$d"
          done
          sudo docker image prune -af >/dev/null 2>&1 || true
          # Swap on the separate scratch disk, not the root one.
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/harmoni.swap
          sudo chmod 600 /mnt/harmoni.swap
          sudo mkswap /mnt/harmoni.swap
          sudo swapon /mnt/harmoni.swap
          free -h
          df -h / /mnt

      - name: Build APK
        working-directory: android
        run: |
          # The generated file has no trailing newline: start on a new line.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=3\n' >> gradle.properties
          tail -4 gradle.properties
          # armv7 too: many phones on Android 8-10 run a 32-bit system on a 64-bit chip and can't
          # install an arm64-only APK. Run the workflow by hand with arm64 only for a quicker build.
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }} --no-daemon --build-cache

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/harmoni-${APP_VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: harmoni-${{ env.APP_VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Release notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # What changed since the last release, a commit subject a line. The app shows these
        # as "What's new" when it offers the update.
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          notes="$RUNNER_TEMP/notes.md"
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | grep -v '\[skip ci\]' | grep -v '^- CI:' | head -30 > "$notes" || true
          [ -s "$notes" ] || echo "- Small fixes and improvements" > "$notes"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...v%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$APP_VERSION" >> "$notes"
          fi
          cat "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Harmoni ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body_path: ${{ env.NOTES_FILE }}
          make_latest: true
